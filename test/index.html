<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umean 编辑器测试</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
    />
    <link rel="stylesheet" href="/styles/rich.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        max-width: 1200px;
      }

      .layout .panel:first-child {
        grid-row: span 3;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .layout .panel:first-child {
          grid-row: auto;
        }
      }

      .panel {
        border-radius: 12px;
        background: #1e293b;
        border: 1px solid #334155;
        overflow: hidden;
      }

      .panel-header {
        padding: 0.75rem 1rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: #94a3b8;
        border-bottom: 1px solid #334155;
        background: #172033;
      }

      #editor {
        min-height: 520px;
        /* 左右对称；左侧需给手柄留位（约 0.45 + 1 + 0.4 ≈ 1.85rem） */
        padding: 1.15rem 1.75rem;
      }

      .editor-content {
        outline: none;
        min-height: 480px;
      }

      .editor-content h1,
      .editor-content h2,
      .editor-content h3 {
        line-height: 1.3;
      }

      .editor-content p {
        margin: 0.5rem 0;
      }

      .editor-content ul,
      .editor-content ol {
        padding-left: 1.5rem;
      }

      .editor-content pre {
        background: #0f172a;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        overflow-x: auto;
      }

      .editor-content code {
        font-family: ui-monospace, monospace;
        font-size: 0.9em;
      }

      .output {
        margin: 0;
        padding: 1rem 1.25rem;
        min-height: 120px;
        max-height: 200px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
      }

      #json-output {
        color: #a78bfa;
      }

      #html-output {
        color: #34d399;
      }

      #markdown-output {
        color: #38bdf8;
      }

      .panel-header kbd {
        font: inherit;
        font-size: 0.75rem;
        font-weight: 500;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #cbd5e1;
      }

      .find-bar {
        display: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
        padding: 0.6rem 0.85rem;
        border-bottom: 1px solid #334155;
        background: #172033;
      }

      .find-bar.is-open {
        display: flex;
      }

      .find-bar input {
        min-width: 8rem;
        flex: 1 1 8rem;
        max-width: 14rem;
        padding: 0.35rem 0.55rem;
        border: 1px solid #475569;
        border-radius: 6px;
        background: #0f172a;
        color: #e2e8f0;
        font: inherit;
        font-size: 0.85rem;
      }

      .find-bar input:focus {
        outline: 1px solid #64748b;
      }

      .find-bar button {
        padding: 0.35rem 0.6rem;
        border: 1px solid #475569;
        border-radius: 6px;
        background: #1e293b;
        color: #e2e8f0;
        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;
      }

      .find-bar button:hover {
        background: #334155;
      }

      .find-bar label {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.8rem;
        color: #94a3b8;
        user-select: none;
      }

      .find-bar .find-status {
        margin-left: auto;
        font-size: 0.8rem;
        color: #94a3b8;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h1>umean 编辑器测试</h1>

    <div class="layout">      
      <div class="panel">
        <div class="panel-header">编辑器 · <kbd>Ctrl/Cmd+F</kbd> 查找替换</div>
        <div class="find-bar" id="find-bar" hidden>
          <input id="find-query" type="search" placeholder="查找…" autocomplete="off" />
          <input id="find-replace" type="text" placeholder="替换为…" autocomplete="off" />
          <label><input id="find-case" type="checkbox" /> 区分大小写</label>
          <button type="button" id="find-prev" title="上一处">↑</button>
          <button type="button" id="find-next" title="下一处">↓</button>
          <button type="button" id="find-replace-one">替换</button>
          <button type="button" id="find-replace-all">全部替换</button>
          <button type="button" id="find-clear">清除</button>
          <span class="find-status" id="find-status">未搜索</span>
        </div>
        <div id="editor" class="umean-editor"></div>
      </div>
      <div class="panel">
        <div class="panel-header">JSON</div>
        <pre id="json-output" class="output">加载中...</pre>
      </div>
      <div class="panel">
        <div class="panel-header">HTML</div>
        <pre id="html-output" class="output">加载中...</pre>
      </div>
      <div class="panel">
        <div class="panel-header">Markdown</div>
        <pre id="markdown-output" class="output">加载中...</pre>
      </div>
    </div>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
