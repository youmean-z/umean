<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umean TenTap Editor</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css"
    />
    <link rel="stylesheet" href="../../styles/rich-minimal.css" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #root > div:nth-of-type(1) {
        position: absolute;
        height: 100%;
        overflow: auto;
        width: 100%;
        top: 0;
        bottom: 0;
        overscroll-behavior: contain;
      }

      #root > div.dynamic-height {
        height: unset;
      }

      #root div .ProseMirror {
        box-sizing: border-box;
        min-height: 100%;
        overflow: visible;
        outline: none;
        padding: 16px;
      }

      #root div.dynamic-height .ProseMirror {
        height: unset;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
