<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>umean TenTap Editor</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
    />
    <link rel="stylesheet" href="../../styles/rich-minimal.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      #root > div:nth-of-type(1) {
        position: absolute;
        height: 100%;
        overflow: auto;
        width: 100%;
        top: 0;
        bottom: 0;
      }

      #root > div.dynamic-height {
        height: unset;
      }

      #root div .ProseMirror {
        min-height: 100%;
        overflow: visible;
        outline: none;
        padding: 16px;
      }

      #root div.dynamic-height .ProseMirror {
        height: unset;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
